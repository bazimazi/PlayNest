[package]
name = "playnest"
version = "0.1.0"
description = "PlayNest desktop shell around the same web build"
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (rust-lang/cargo#8519).
# staticlib/cdylib are what `tauri android` and `tauri ios` link against.
name = "playnest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
