name: Desktop apps

# Installers for Windows, macOS and Linux, from the Tauri shell in src-tauri/.
#
# - Run by hand (Actions > Desktop apps > Run workflow) for test builds: the
#   installers are attached to the run as artifacts.
# - Pushing a tag like `v1.5.0` does the same and also drafts a GitHub release
#   with them. Nothing is published until the draft is reviewed and released
#   by hand.
#
# The builds are unsigned unless these optional secrets are set, which is fine
# for testing but not for giving the app to families:
#
#   secrets.APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#                                 macOS code signing (base64 .p12 + its password)
#   secrets.APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#                                 macOS notarization (app-specific password)
#
# Windows code signing needs a certificate provider of the owner's choosing
# (Azure Trusted Signing, a cloud HSM, ...); configure it as
# `bundle.windows.signCommand` once one is chosen.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            args: '--target universal-apple-darwin'
          # 22.04 rather than latest: an AppImage only runs on systems at least
          # as new as the one it was built on.
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install WebKitGTK and friends
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # A secret that is not set still arrives as an empty string, and the
      # bundler treats an empty APPLE_CERTIFICATE as a certificate to import.
      # Only export the ones that actually have a value.
      - name: Use configured signing settings
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -n "${!name}" ]; then
              delimiter="EOF_$(openssl rand -hex 8)"
              { echo "$name<<$delimiter"; printf '%s\n' "${!name}"; echo "$delimiter"; } >> "$GITHUB_ENV"
            fi
          done

      - name: Build installers
        if: github.ref_type != 'tag'
        run: npx tauri build ${{ matrix.args }}

      - name: Build installers and attach them to a draft release
        if: github.ref_type == 'tag'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'PlayNest ${{ github.ref_name }}'
          releaseBody: See the assets below to download and install this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: playnest-${{ matrix.platform }}
          path: src-tauri/target/**/release/bundle/
          if-no-files-found: error
